<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | UTP</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="text-center mb-4">

                <div class="logo-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>

                <h2 class="fw-bold mt-3">UTP</h2>

                <p class="text-muted">
                    University Tecnology Petron
                </p>

            </div>

            <h4 class="fw-bold">Student Registration</h4>

            <p class="text-muted mb-4">
                Create your student portal account.
            </p>

            <!-- Registration Error -->
            <div id="registerError"
                 class="alert alert-danger d-none"
                 role="alert">
            </div>

            <!-- Registration Form -->
            <form id="registerForm">

                <div class="mb-3">
                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           class="form-control"
                           placeholder="Enter Full Name"
                           autocomplete="name"
                           required>
                </div>

                <div class="mb-3">
                    <label for="registerStudentId"
                           class="form-label">
                        Student ID
                    </label>

                    <input type="text"
                           id="registerStudentId"
                           class="form-control"
                           placeholder="e.g. UTP2026002"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter Email"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-3">
                    <label for="registerPassword"
                           class="form-label">
                        Password
                    </label>

                    <input type="password"
                           id="registerPassword"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword"
                           class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-auth w-100 mt-3">
                    Create Account
                </button>

            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

        </div>

    </main>

    <script src="js/authentication.js"></script>
    <script src="js/common.js"></script>

</body>
</html>
